name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and configured friends without sending
        type: boolean
        default: true
      test_target:
        description: Optional exact configured friend name; required for manual real-send verification
        type: string
        required: false
      history_check:
        description: Verify persistent cloud duplicate history without opening Douyin
        type: boolean
        default: false
  # Deliberately disabled until the cloud single-target send and duplicate protection
  # have both been verified and the user explicitly authorizes automatic sends.
  # schedule:
  #   - cron: "0 14 * * *" # 22:00 Asia/Shanghai (UTC+8)

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
      WEBHOOK_TEMPLATE: ${{ secrets.WEBHOOK_TEMPLATE }}
      HEADLESS: "true"
      TRACE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.history_check == true) }}
        run: pip install -r requirements.txt
      - if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.history_check == true) }}
        run: python -m playwright install --with-deps chromium
      - name: Write protected configuration
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.history_check == true) }}
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json
      - name: Validate protected cloud configuration
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.history_check == true) }}
        shell: bash
        run: |
          python - <<'PY'
          from app.config import load_settings, load_task

          task = load_task(load_settings())
          if len(task.targets) != 24:
              raise SystemExit(f"DOUYIN_CONFIG must contain exactly 24 targets; got {len(task.targets)}")
          if task.prevent_duplicates is not True:
              raise SystemExit("DOUYIN_CONFIG must set prevent_duplicates to true for cloud runs")
          if not task.stickers:
              raise SystemExit("DOUYIN_CONFIG must include the native sticker mapping")
          def is_native_sticker(message):
              if message.type == "douyin_sticker":
                  return message.sticker in task.stickers
              if message.type == "random":
                  return bool(message.choices) and all(is_native_sticker(choice) for choice in message.choices)
              return False

          if not all(
              is_native_sticker(message)
              for target in task.targets
              for message in target.messages
          ):
              raise SystemExit("Every cloud target must use only configured native sticker messages")
          print(f"Cloud configuration validated: target_count={len(task.targets)}, native_sticker_only=true")
          PY
      - name: Write multi-account configuration
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.history_check == true) }}
        shell: bash
        env:
          COOKIE_1: ${{ secrets.DOUYIN_COOKIE_ACCOUNT1 }}
          CONFIG_1: ${{ secrets.DOUYIN_CONFIG_ACCOUNT1 }}
          COOKIE_2: ${{ secrets.DOUYIN_COOKIE_ACCOUNT2 }}
          CONFIG_2: ${{ secrets.DOUYIN_CONFIG_ACCOUNT2 }}
          COOKIE_3: ${{ secrets.DOUYIN_COOKIE_ACCOUNT3 }}
          CONFIG_3: ${{ secrets.DOUYIN_CONFIG_ACCOUNT3 }}
          COOKIE_4: ${{ secrets.DOUYIN_COOKIE_ACCOUNT4 }}
          CONFIG_4: ${{ secrets.DOUYIN_CONFIG_ACCOUNT4 }}
          COOKIE_5: ${{ secrets.DOUYIN_COOKIE_ACCOUNT5 }}
          CONFIG_5: ${{ secrets.DOUYIN_CONFIG_ACCOUNT5 }}
          LEGACY_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          LEGACY_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
        run: |
          mkdir -p config/tasks
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if not any(os.environ.get(f"COOKIE_{i}") for i in range(1, 6)):
              print("No multi-account Secrets configured; using the single-account Secrets")
              raise SystemExit(0)

          accounts = []
          for index in range(1, 6):
              if index == 1 and not os.environ.get("COOKIE_1") and not os.environ.get("CONFIG_1"):
                  cookie = os.environ.get("LEGACY_COOKIE")
                  config = os.environ.get("LEGACY_CONFIG")
              else:
                  cookie = os.environ.get(f"COOKIE_{index}")
                  config = os.environ.get(f"CONFIG_{index}")
              if not cookie and not config:
                  continue
              if not cookie or not config:
                  raise SystemExit(
                      f"account{index} requires both DOUYIN_COOKIE_ACCOUNT{index} and "
                      f"DOUYIN_CONFIG_ACCOUNT{index}"
                  )
              try:
                  json.loads(cookie)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_COOKIE_ACCOUNT{index} is not valid JSON: {exc}") from exc
              try:
                  json.loads(config)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_CONFIG_ACCOUNT{index} is not valid JSON: {exc}") from exc
              env_file = f".env.account{index}"
              Path(env_file).write_text(
                  f"DOUYIN_COOKIE={json.dumps(cookie)}\nTASK_CONFIG=config/tasks/account{index}.json\n",
                  encoding="utf-8",
              )
              Path(f"config/tasks/account{index}.json").write_text(config, encoding="utf-8")
              accounts.append({"id": f"account{index}", "enabled": True, "env_file": env_file})
          Path("config/accounts.json").write_text(
              json.dumps({"accounts": accounts}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
      - name: Require an exact manual real-send target
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
        shell: bash
        env:
          TEST_TARGET: ${{ inputs.test_target }}
        run: |
          test -n "$TEST_TARGET" || { echo "Manual real send requires test_target"; exit 1; }
      - name: Limit manual run to one configured test friend
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_target != '' }}
        shell: bash
        env:
          TEST_TARGET: ${{ inputs.test_target }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = os.environ.get("TEST_TARGET", "").strip()
          if not target:
              raise SystemExit("Manual real send requires the test_target input")
          path = Path("config.json")
          raw = json.loads(path.read_text(encoding="utf-8"))
          if "targets" in raw:
              selected = [item for item in raw["targets"] if item.get("name") == target]
              raw["targets"] = selected
          elif "friends" in raw:
              selected = [name for name in raw["friends"] if name == target]
              raw["friends"] = selected
          else:
              raise SystemExit("DOUYIN_CONFIG has neither targets nor friends")
          if len(selected) != 1:
              raise SystemExit("test_target must exactly match one configured friend")
          path.write_text(json.dumps(raw, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Manual run scope validated: target_count=1")
          PY
      - name: Restore cloud send history
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.dry_run == false || inputs.history_check == true)) }}
        shell: bash
        env:
          HISTORY_BRANCH: douyin-send-history
        run: |
          mkdir -p artifacts
          if git ls-remote --exit-code origin "refs/heads/${HISTORY_BRANCH}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${HISTORY_BRANCH}"
            git show FETCH_HEAD:history.json > artifacts/history.json
            echo "Cloud history restored"
          else
            printf '{}' > artifacts/history.json
            echo "Cloud history initialized"
          fi
      - name: Prepare cloud send history
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.dry_run == false || inputs.history_check == true)) }}
        shell: bash
        run: |
          mkdir -p artifacts
          test -f artifacts/history.json || printf '{}' > artifacts/history.json
      - name: Verify persistent-history contract
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.history_check == true }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.history import History

          history = History(Path("artifacts/history.json"))
          today_key = history.key("cloud-history-check", "2099-12-31", "self-test", "native-sticker")
          tomorrow_key = history.key("cloud-history-check", "2100-01-01", "self-test", "native-sticker")
          if history.contains(today_key):
              print("Cloud history restored: same-date success remains blocked")
          else:
              history.mark_success(today_key)
              print("Cloud history initialized with a successful self-test")
          if history.contains(tomorrow_key):
              raise SystemExit("next-date key was unexpectedly blocked")
          print("Next-date history key remains available")
          PY
      - name: Run
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.history_check == true) }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python run.py --dry-run
          else
            python run.py
          fi
      - name: Persist cloud send history
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.dry_run == false || inputs.history_check == true))) }}
        shell: bash
        env:
          HISTORY_BRANCH: douyin-send-history
        run: |
          test -f artifacts/history.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w artifacts/history.json)
          tree=$(printf '100644 blob %s\thistory.json\n' "$blob" | git mktree)
          if git ls-remote --exit-code origin "refs/heads/${HISTORY_BRANCH}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${HISTORY_BRANCH}"
            parent=$(git rev-parse FETCH_HEAD)
            commit=$(printf 'Persist cloud duplicate history\n' | git commit-tree "$tree" -p "$parent")
          else
            commit=$(printf 'Initialize cloud duplicate history\n' | git commit-tree "$tree")
          fi
          git push origin "${commit}:refs/heads/${HISTORY_BRANCH}"
      - name: Upload sanitized diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-${{ github.run_id }}
          path: |
            artifacts/result.json
            artifacts/metrics.json
          retention-days: 3
          if-no-files-found: ignore
